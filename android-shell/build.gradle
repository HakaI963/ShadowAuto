plugins {
    id "com.android.application"
}

def enableOcr = providers.gradleProperty("enableOcr")
        .map { it.toBoolean() }
        .orElse(true)
        .get()

android {
    namespace = "com.silentauto.shell"
    compileSdk = 36

    defaultConfig {
        applicationId = "com.silentauto.shell"
        minSdk = 29
        targetSdk = 36
        versionCode = 1
        versionName = "0.1"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Extract native .so files to nativeLibraryDir at install time.
    // (AGP rejects android:extractNativeLibs in the manifest; use this.)
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

}

dependencies {
    compileOnly project(":android-stubs")
    implementation project(":tess-ocr")
    implementation "com.google.code.gson:gson:2.11.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
}

if (enableOcr) {
    preBuild.dependsOn(":tess-ocr:prepareTesseractOcr")

    tasks.register("copyTessOcrRuntime", Copy) {
        dependsOn("assembleDebug")
        from("build/intermediates/merged_native_libs/debug/mergeDebugNativeLibs/out/lib/arm64-v8a") {
            into("lib/arm64-v8a")
        }
        from("../tess-ocr/TessData/tessdata") {
            into("tessdata")
        }
        into("build/ocr-runtime")
    }

    tasks.register("syncWebLauncherArtifacts", Copy) {
        dependsOn("copyTessOcrRuntime", ":controller-app:assembleDebug")
        from("build/outputs/apk/debug/android-shell-debug.apk") {
            rename { "silent-shell.apk" }
            into(".")
        }
        from("../controller-app/build/outputs/apk/debug/controller-app-debug.apk") {
            rename { "controller-app.apk" }
            into(".")
        }
        from("build/ocr-runtime") {
            into("ocr")
        }
        into("../web-launcher/static")
    }
}
