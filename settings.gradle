        google()
        mavenCentral()
        // Local vendored AARs (Tesseract4Android). Group is ignored by flatDir.
        flatDir {
            dirs("tess-ocr/libs")
        }
    }
}

rootProject.name = "RapheleSuite"
include ":android-stubs"
include ":tess-ocr"
include ":android-shell"
include ":controller-app"
