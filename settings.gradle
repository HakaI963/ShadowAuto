pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Tesseract4Android (Tesseract 5.x AAR) is published via JitPack.
        maven {
            url "https://jitpack.io"
            content {
                includeGroup "com.github.adaptech-cz.Tesseract4Android"
            }
        }
    }
}

rootProject.name = "ShadowAutoSuite"
include ":android-stubs"
include ":tess-ocr"
include ":android-shell"
include ":controller-app"
