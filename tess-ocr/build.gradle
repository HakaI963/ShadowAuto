plugins {
    id "com.android.library"
}

android {
    namespace = "com.raphele.tessocr"
    compileSdk = 36
    // Pinned so AGP resolves a matching NDK (source of libc++_shared.so).
    // No CMake build in this module.
    ndkVersion = "23.1.7779620"

    defaultConfig {
        minSdk = 29
    }

    sourceSets {
        main {
            jniLibs.srcDirs += 'build/generated/jniLibs'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Tesseract 5.5 + Leptonica, prebuilt arm64/x86 .so, vendored AAR
    // (tess-ocr/libs) so CI never depends on external artifact hosts.
    // flatDir is required: files() does not unpack AAR contents. The AAR's
    // only transitive dep (androidx.annotation) is declared explicitly
    // because flatDir carries no POM metadata.
    implementation("local:tesseract4android:4.8.0@aar")
    implementation "androidx.annotation:annotation:1.3.0"
}

// AGP does not auto-package libc++_shared.so when the project has no native
// build of its own, but tess's prebuilt .so files link against it. Copy it
// from the NDK into packaged jniLibs so it lands in every consuming APK
// (and therefore in nativeLibraryDir, from which OCR deploys it).
// NOTE: the NDK is located lazily at execution time; configuration never
// touches it, so even `gradle tasks` works without an NDK installed.
File findLibcxxShared() {
    List<File> roots = []
    String envNdk = System.getenv("ANDROID_NDK_HOME")
    if (envNdk) {
        roots.add(new File(envNdk))
    }
    try {
        File sdkNdk = new File(android.sdkDirectory, "ndk")
        if (sdkNdk.isDirectory()) {
            File[] vers = sdkNdk.listFiles()
            if (vers) {
                List<File> ordered = vers.toList().sort { a, b -> b.name <=> a.name }
                File pinned = new File(sdkNdk, "23.1.7779620")
                ordered.remove(pinned)
                ordered.add(0, pinned)
                roots.addAll(ordered)
            }
        }
    } catch (Throwable ignored) {
    }
    for (File ndk in roots) {
        File candidate = new File(ndk,
                "toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so")
        if (candidate.isFile()) {
            return candidate
        }
    }
    throw new GradleException(
            "libc++_shared.so not found; checked ANDROID_NDK_HOME and SDK ndk dirs")
}

tasks.register("copyLibcxxShared", Copy) {
    from({ findLibcxxShared() })
    into("build/generated/jniLibs/arm64-v8a")
}

tasks.named("preBuild").configure {
    dependsOn("copyLibcxxShared")
}

def tessdataFiles = [
        "chi_sim.traineddata": "https://raw.githubusercontent.com/tesseract-ocr/tessdata/main/chi_sim.traineddata",
        "eng.traineddata"    : "https://raw.githubusercontent.com/tesseract-ocr/tessdata/main/eng.traineddata",
]

tasks.register("prepareTesseractOcr") {
    group = "ocr"
    description = "Download Tesseract chi_sim+eng traineddata for offline OCR."
    doLast {
        File dir = file("TessData/tessdata")
        if (!dir.isDirectory() && !dir.mkdirs()) {
            throw new GradleException("Create tessdata directory failed: ${dir}")
        }
        tessdataFiles.each { name, url ->
            File dest = new File(dir, name)
            if (!dest.isFile() || dest.length() < 1000000) {
                logger.lifecycle("Downloading ${url}")
                ant.get(src: url, dest: dest)
            }
            if (!dest.isFile() || dest.length() < 1000000) {
                throw new GradleException("Download failed or too small: ${dest} (${dest.length()} bytes)")
            }
        }
    }
}
