name: Build APK (OCR)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0 ndk;23.1.7779620

      - name: Cache Gradle
        uses: gradle/gradle-build-action@v3

      - name: Cache Tesseract OCR traineddata
        uses: actions/cache@v4
        with:
          path: |
            **/tess-ocr/TessData
          key: tess-ocr-${{ runner.os }}-${{ hashFiles('**/tess-ocr/build.gradle') }}
          restore-keys: |
            tess-ocr-${{ runner.os }}-

      - name: Build release APKs (OCR enabled)
        env:
          ORG_GRADLE_PROJECT_enableOcr: "true"
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease -PenableOcr=true --no-daemon --stacktrace

      - name: Locate signing tools
        run: |
          # NOTE: intentional `set +o pipefail` — ls-based probes below must
          # degrade to clean FATALs, never silent death via pipefail+errexit.
          set +o pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [ -n "$SDK_ROOT" ] && [ -d "$SDK_ROOT/build-tools" ] || SDK_ROOT="$HOME/Android/Sdk"
          [ -d "$SDK_ROOT/build-tools" ] || SDK_ROOT="/usr/local/lib/android/sdk"
          echo "SDK_ROOT=$SDK_ROOT (ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset} ANDROID_HOME=${ANDROID_HOME:-unset})"
          [ -d "$SDK_ROOT/build-tools" ] || { echo "FATAL: no build-tools under $SDK_ROOT"; ls "$SDK_ROOT" 2>/dev/null; exit 1; }
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          df -h "$GITHUB_WORKSPACE" | tail -2
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias shadowauto \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass shadowauto -keypass shadowauto \
            -dname "CN=ShadowAuto, O=ShadowAuto, L=Unknown, ST=Unknown, C=US"
          mkdir -p signed-apks
          echo "build-tools versions:"
          ls "$SDK_ROOT/build-tools"
          APKSIGNER="$(ls "$SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | tail -n 1)"
          ZIPALIGN="$(ls "$SDK_ROOT"/build-tools/*/zipalign 2>/dev/null | tail -n 1)"
          [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ] || { echo "FATAL: apksigner missing under $SDK_ROOT/build-tools"; exit 1; }
          [ -n "$ZIPALIGN" ] && [ -x "$ZIPALIGN" ] || { echo "FATAL: zipalign missing under $SDK_ROOT/build-tools"; exit 1; }
          echo "$APKSIGNER" > .apksigner_path
          echo "$ZIPALIGN" > .zipalign_path
          echo "chosen apksigner: $APKSIGNER"
          echo "chosen zipalign: $ZIPALIGN"
          echo "=== release APKs ==="
          find . -path '*/build/outputs/apk/release/*.apk' -exec ls -lh {} \;
          COUNT="$(find . -path '*/build/outputs/apk/release/*-release-unsigned.apk' | wc -l)"
          echo "unsigned APK count: $COUNT"
          [ "$COUNT" -gt 0 ] || { echo "FATAL: no unsigned release APKs found"; exit 1; }

      - name: Zipalign APKs
        run: |
          ZIPALIGN="$(tail -n 1 .zipalign_path)"
          [ -x "$ZIPALIGN" ] || { echo "FATAL: zipalign not executable: $ZIPALIGN"; exit 1; }
          for apk in $(find . -path '*/build/outputs/apk/release/*-release-unsigned.apk'); do
            base="$(basename "$apk" -release-unsigned.apk)"
            echo "=== zipalign $apk -> signed-apks/${base}-release.apk ==="
            "$ZIPALIGN" -f -p 4 "$apk" "signed-apks/${base}-release.apk"
          done
          ls -lh signed-apks

      - name: Sign APKs with apksigner
        run: |
          APKSIGNER="$(tail -n 1 .apksigner_path)"
          [ -x "$APKSIGNER" ] || { echo "FATAL: apksigner not executable: $APKSIGNER"; exit 1; }
          for apk in signed-apks/*-release.apk; do
            echo "=== apksigner sign $apk ==="
            "$APKSIGNER" sign --ks release.keystore --ks-pass pass:shadowauto --key-pass pass:shadowauto "$apk"
            "$APKSIGNER" verify "$apk" && echo "verified $apk"
          done
          # Unified APK = controller UI + shell server + OCR assets + Shizuku starter.
          if [ -f signed-apks/controller-app-release.apk ]; then
            cp signed-apks/controller-app-release.apk signed-apks/ShadowAuto-unified-release.apk
          fi
          ls -lh signed-apks

      - name: Prepare and package OCR runtime
        run: |
          ./gradlew :android-shell:syncWebLauncherArtifacts -PenableOcr=true --no-daemon
          cd web-launcher/static
          zip -r "$GITHUB_WORKSPACE/ocr-runtime.zip" ocr
          cd "$GITHUB_WORKSPACE"
          ls -lh ocr-runtime.zip

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shadowauto-apks
          path: |
            signed-apks/*.apk
            ocr-runtime.zip
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            signed-apks/*.apk
            ocr-runtime.zip

      # Readable CI diagnostics without API access: on any failure, push a
      # small report to the ci-logs branch (never triggers this workflow).
      - name: Dump diagnostics on failure
        if: failure()
        run: |
          {
            echo "### run ${{ github.run_number }} sha ${{ github.sha }} $(date -u)"
            echo "--- env ---"
            env | grep -iE "android|java|sdk|ndk|gradle|workspace|github_" | sort
            echo "--- which ---"
            which java keytool sdkmanager apksigner zipalign 2>&1
            java -version 2>&1 | head -3
            echo "--- locate replay (each cmd with rc) ---"
            R="/usr/local/lib/android/sdk"; echo "ls SDK_ROOT rc=$?:"; ls "$R/build-tools" 2>&1 | head -6; echo "rc=$?"
            echo "keytool probe:"; keytool -help 2>&1 | head -2; echo "rc=$?"
            echo "genkeypair dry-run to /tmp:"
            keytool -genkeypair -keystore /tmp/probe.keystore -alias probe -keyalg RSA -keysize 2048 -validity 30 -storepass x -keypass x -dname "CN=T" 2>&1 | tail -3; echo "rc=$?"
            ls -la /tmp/probe.keystore 2>&1
            echo "mkdir probe:"; mkdir -p signed-apks && echo "mkdir rc=0" || echo "mkdir rc=$?"
            echo "--- sdk candidates ---"
            for d in "${ANDROID_SDK_ROOT:-}" "${ANDROID_HOME:-}" "$HOME/Android/Sdk" /usr/local/lib/android/sdk /opt/android-sdk; do
              [ -n "$d" ] || continue
              echo "== $d"
              ls "$d/build-tools" 2>&1 | head -5
            done
            echo "--- apks in build outputs ---"
            find . -path '*build/outputs/apk*' -name '*.apk' -exec ls -lh {} \; 2>/dev/null | head -10
            echo "--- signed-apks ---"
            ls -lh signed-apks 2>&1 | head -10
            echo "--- disk ---"
            df -h "$GITHUB_WORKSPACE" 2>/dev/null | tail -1
            echo "--- tessdata ---"
            ls -lh tess-ocr/TessData/tessdata 2>/dev/null | head -5
          } > /tmp/ci-diag.txt 2>&1 || true
          git config user.name "ci-debug" || true
          git config user.email "ci-debug@local" || true
          git fetch origin ci-logs 2>/dev/null || true
          git checkout -B ci-logs 2>/dev/null || true
          mkdir -p ci-debug
          cp /tmp/ci-diag.txt "ci-debug/${{ github.run_number }}.txt"
          git add "ci-debug/${{ github.run_number }}.txt"
          git commit -m "CI diagnostics for run ${{ github.run_number }}" 2>/dev/null || true
          git push origin ci-logs --force 2>&1 | tail -2 || true
