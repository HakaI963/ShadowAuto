name: Build APK (OCR)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0 ndk;23.1.7779620 cmake;3.22.1

      - name: Cache Gradle
        uses: gradle/gradle-build-action@v3

      - name: Cache Paddle Lite OCR assets
        uses: actions/cache@v4
        with:
          path: |
            **/paddler-ocr/PaddleLite
            **/paddler-ocr/OpenCV
            **/paddler-ocr/PaddleOcrAssets
            **/paddler-ocr/cache
          key: paddle-ocr-${{ runner.os }}-${{ hashFiles('**/paddler-ocr/build.gradle') }}
          restore-keys: |
            paddle-ocr-${{ runner.os }}-

      - name: Build release APKs (OCR enabled)
        env:
          ORG_GRADLE_PROJECT_enablePaddleLiteOcr: "true"
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease -PenablePaddleLiteOcr=true --no-daemon --stacktrace

      - name: Sign release APKs
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias shadowauto \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass shadowauto -keypass shadowauto \
            -dname "CN=ShadowAuto, O=ShadowAuto, L=Unknown, ST=Unknown, C=US"
          mkdir -p signed-apks
          APKSIGNER="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | tail -n 1)"
          ZIPALIGN="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/zipalign | tail -n 1)"
          for apk in $(find . -path '*/build/outputs/apk/release/*-release-unsigned.apk'); do
            base="$(basename "$apk" -release-unsigned.apk)"
            "$ZIPALIGN" -f -p 4 "$apk" "signed-apks/${base}-release.apk"
            "$APKSIGNER" sign --ks release.keystore --ks-pass pass:shadowauto --key-pass pass:shadowauto "signed-apks/${base}-release.apk"
          done
          # Unified APK = controller UI + shell server + OCR assets + Shizuku starter.
          if [ -f signed-apks/controller-app-release.apk ]; then
            cp signed-apks/controller-app-release.apk signed-apks/ShadowAuto-unified-release.apk
          fi
          ls -lh signed-apks

      - name: Prepare and package OCR runtime
        run: |
          ./gradlew :android-shell:syncWebLauncherArtifacts -PenablePaddleLiteOcr=true --no-daemon
          cd web-launcher/static
          zip -r "$GITHUB_WORKSPACE/ocr-runtime.zip" ocr
          cd "$GITHUB_WORKSPACE"
          ls -lh ocr-runtime.zip

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shadowauto-apks
          path: |
            signed-apks/*.apk
            ocr-runtime.zip
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            signed-apks/*.apk
            ocr-runtime.zip
