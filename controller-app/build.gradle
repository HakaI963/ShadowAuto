plugins {
    id "com.android.application"
}

def enablePaddleLiteOcr = providers.gradleProperty("enablePaddleLiteOcr")
        .map { it.toBoolean() }
        .orElse(true)
        .get()

android {
    namespace = "com.silentauto.controller"
    compileSdk = 36

    defaultConfig {
        applicationId = "com.silentauto.controller"
        minSdk = 29
        targetSdk = 36
        versionCode = 5
        versionName = "0.5-unified"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs += '../android-shell/src/main/java'
            assets.srcDirs += 'build/generated/ocr-assets'
        }
    }
}

dependencies {
    compileOnly project(":android-stubs")
    implementation project(":paddler-ocr")
    implementation "com.google.code.gson:gson:2.11.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "androidx.viewpager2:viewpager2:1.1.0"
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
}

if (enablePaddleLiteOcr) {
    tasks.register("copyUnifiedOcrAssets", Copy) {
        dependsOn(":paddler-ocr:preparePaddleLiteOcr")
        from("../paddler-ocr/PaddleOcrAssets") {
            include "models/**"
            include "labels/**"
        }
        into("build/generated/ocr-assets/ocr")
    }
    tasks.named("preBuild").configure {
        dependsOn("copyUnifiedOcrAssets")
    }
}
